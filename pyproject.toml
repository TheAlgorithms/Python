lint.mccabe.max-complexity = 17  # default: 10
lint.pylint.allow-magic-value-types = [
  "float",
  "int",
  "str",
]
lint.pylint.max-args = 10  # default: 5
lint.pylint.max-branches = 20  # default: 12
lint.pylint.max-returns = 8  # default: 6
lint.pylint.max-statements = 88  # default: 50

[tool.codespell]
ignore-words-list = """\
  3rt,abd,aer,ans,bitap,crate,damon,fo,followings,hist,iff,kwanza,manuel,mater,secant,som,sur,tim,toi,zar\
  """
skip = """\
  ./.*,*.json,*.lock,ciphers/prehistoric_men.txt,project_euler/problem_022/p022_names.txt,pyproject.toml,strings/dictio\
  nary.txt,strings/words.txt\
  """

[tool.mypy]
python_version = "3.14"

[tool.ty]
# Type-check against a regular (GIL) 3.14 interpreter. Pinning this keeps ty's
# assumptions consistent with the CI job in .github/workflows/ty.yml, where the
# free-threaded 3.14t test venv would otherwise leave several stubs unresolved.
environment.python-version = "3.14"
rules.call-non-callable = "ignore"
rules.deprecated = "ignore"
rules.invalid-argument-type = "ignore"
rules.invalid-return-type = "ignore"
rules.no-matching-overload = "ignore"
rules.not-iterable = "ignore"
rules.not-subscriptable = "ignore"
rules.parameter-already-assigned = "ignore"
rules.unresolved-attribute = "ignore"
rules.unresolved-import = "ignore"
rules.unsupported-operator = "ignore"

[tool.pytest]
ini_options.addopts = [
  "--durations=10",
  "--doctest-modules",
  "--showlocals",
]
ini_options.markers = [
  "mat_ops: mark a test as utilizing matrix operations.",
]

[tool.coverage]
report.omit = [
  ".env/*",
  "project_euler/*",
]
report.sort = "Cover"

[tool.rumdl]
disable = [
  # "MD013",
  "MD033",
  "MD036",
  "MD041",
]
exclude = [ "DIRECTORY.md", "docs/hacktober_2026_prep.md" ]
flavor = "gfm"
line-length = 350
per-file-ignores."index.md" = [ "MD040" ]
