name: Test DevContainer Build

on:
  push:
    paths:
      - ".devcontainer/**"
      - ".github/workflows/devcontainer_ci.yml"
      - ".python-version"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    paths:
      - ".devcontainer/**"
      - ".github/workflows/devcontainer_ci.yml"
      - ".python-version"
      - "pyproject.toml"
      - "uv.lock"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: "uv --version"
