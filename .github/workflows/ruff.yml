# https://beta.ruff.rs
name: ruff
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      # Use the same pinned Ruff version as the local pre-commit hook.
      - name: Lint with Ruff (pre-commit)
        run: uvx pre-commit run ruff-check --all-files
